name: Update Block Ruleset

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

jobs:
  merge-rules-block:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download and Process Block Rules
        run: |
          touch temp_block.ruleset

          URLS=(
            "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockclash.list"
          )

          for url in "${URLS[@]}"; do
            echo "Processing $url..."

            curl -fsSL "$url" \
              | sed '1{/^\[Rule\]$/d;}' \
              | sed 's/,REJECT-DROP$//' \
              >> temp_block.ruleset
          done

          # 检查下载后的规则文件是否为空
          if [ ! -s temp_block.ruleset ]; then
            echo "ERROR: No rules downloaded!"
            exit 1
          fi

          # 删除注释和空行
          sed -i '/^#/d; /^[[:space:]]*$/d' temp_block.ruleset

          # 去重排序并生成最终文件
          sort -u temp_block.ruleset > block.ruleset

          rm temp_block.ruleset

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add block.ruleset
          git commit -m "Update block.ruleset - $(date)" || exit 0
          git push
