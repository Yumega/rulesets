name: Update Block Ruleset

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

jobs:
  merge-rules-block:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download and Process Block Rules
        run: |
          touch temp_block.ruleset

          URLS=(
            "你的规则源URL"
          )

          for url in "${URLS[@]}"; do
            echo "Processing $url..."

            curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 "$url" \
              >> temp_block.ruleset
          done

          # 检查是否成功下载规则
          if [ ! -s temp_block.ruleset ]; then
            echo "ERROR: No rules downloaded!"
            exit 1
          fi

          # 删除：
          # 1. 所有 [Rule] 整行
          # 2. 所有注释行
          # 3. 所有空行
          # 4. 每行末尾的 ,REJECT-DROP
          sed -i \
            -e '/^[[:space:]]*\[Rule\][[:space:]]*$/d' \
            -e '/^[[:space:]]*#/d' \
            -e '/^[[:space:]]*$/d' \
            -e 's/,REJECT-DROP$//' \
            temp_block.ruleset

          # 去重排序并生成最终文件
          sort -u temp_block.ruleset > block.ruleset

          # 再次确保最终文件不存在 [Rule]
          sed -i '/^[[:space:]]*\[Rule\][[:space:]]*$/d' block.ruleset

          rm temp_block.ruleset

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add block.ruleset
          git commit -m "Update block.ruleset - $(date)" || exit 0
          git push
