name: Update HK Ruleset

on:
  schedule:
    - cron: '0 7 * * 3' # 每天北京时间 10:10 运行
  workflow_dispatch:

jobs:
  merge-rules-hk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download and Process HK Rules
        run: |
          touch temp_hk.ruleset

          URLS=(
            "https://raw.githubusercontent.com/Yumega/iLab/refs/heads/master/ios/VPN/SDR/Rule/NEWS.ruleset"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Telegram/Telegram.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Shadowrocket/Facebook/Facebook.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Shadowrocket/Twitter/Twitter.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Shadowrocket/GitHub/GitHub.list"
          )

          echo "# Last Updated: $(date)" > hk.ruleset

          for url in "${URLS[@]}"; do
            echo "Processing $url..."
            curl -sL "$url" \
              | grep -v '^#' \
              | grep -v '^[[:space:]]*$' \
              >> temp_hk.ruleset
          done

          # 删除 DOMAIN-KEYWORD 和 USER-AGENT 整行规则
          grep -v -E '^(DOMAIN-KEYWORD|USER-AGENT),' temp_hk.ruleset \
            > temp_hk_filtered.ruleset

          # 去重排序并生成最终文件
          sort -u temp_hk_filtered.ruleset >> hk.ruleset

          rm temp_hk.ruleset temp_hk_filtered.ruleset

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hk.ruleset
          git commit -m "Update hk.ruleset - $(date)" || exit 0
          git push
