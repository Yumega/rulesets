name: Update Direct Ruleset

on:
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:

jobs:
  merge-rules-direct:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download and Process Direct Rules
        run: |
          touch temp_direct.ruleset

          URLS=(
            "https://raw.githubusercontent.com/Yumega/iLab/refs/heads/master/ios/VPN/SDR/Rule/Direct.ruleset"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Shadowrocket/SystemOTA/SystemOTA.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ByteDance/ByteDance.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BOC/BOC.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/China/China.list"
          )

          echo "# Last Updated: $(date)" > direct.ruleset

          for url in "${URLS[@]}"; do
            echo "Processing $url..."
            curl -sL "$url" \
              | grep -v '^#' \
              | grep -v '^[[:space:]]*$' \
              | sed 's/,DIRECT//g' \
              >> temp_direct.ruleset
          done

          # 去除 DOMAIN-KEYWORD 和 USER-AGENT 整行规则
          grep -v -E '^(DOMAIN-KEYWORD|USER-AGENT),' temp_direct.ruleset \
            > temp_direct_filtered.ruleset

          # 去重排序，不添加 ,DIRECT
          sort -u temp_direct_filtered.ruleset >> direct.ruleset

          rm temp_direct.ruleset temp_direct_filtered.ruleset

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add direct.ruleset
          git commit -m "Update direct.ruleset - $(date)" || exit 0
          git push
