      - name: Download and Process Direct Rules
        run: |
          touch temp_direct.ruleset
          
          URLS=(
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ByteDance/ByteDance.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/WeChat/WeChat.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BOC/BOC.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list"
          )

          echo "# Last Updated: $(date)" > direct.ruleset
          
          for url in "${URLS[@]}"; do
            echo "Processing $url..."
            curl -sL "$url" | grep -v '^#' | grep -v '^\s*$' | sed 's/,DIRECT//g' >> temp_direct.ruleset
          done

          # 去重排序，不添加 ,DIRECT
          sort -u temp_direct.ruleset >> direct.ruleset
          
          rm temp_direct.ruleset
